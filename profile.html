<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — MindPulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-app-active="profile" data-app-title="Профиль" data-app-subtitle="Данные аккаунта, имя и таймзона для персональной настройки ритма работы.">
  <div class="app-shell app-page-layout">
    <aside data-app-sidebar></aside>

    <div class="app-main">
      <div class="app-content-shell">
        <header data-app-page-header></header>

        <main class="profile-main">
          <section class="section">
            <div class="section-heading">
              <div>
                <p class="section-kicker" data-i18n="profile.kicker">User profile</p>
                <h2 class="dashboard-section-title" data-i18n="profile.title">Ваши данные</h2>
              </div>
            </div>

            <form id="profileForm" class="auth-page-form profile-form">
              <input id="profileEmail" type="email" data-i18n-placeholder="common.email" placeholder="Email" disabled>
              <input id="profileFullName" type="text" data-i18n-placeholder="common.fullNamePlaceholder" placeholder="Имя и фамилия">
              <select id="profileLocale" aria-label="Language"></select>
              <input id="profileTimezone" type="text" data-i18n-placeholder="common.timezonePlaceholder" placeholder="Timezone, например Europe/Moscow">
              <button id="profileSubmit" class="form-action-button" type="submit" data-i18n="profile.save">Сохранить профиль</button>
            </form>

            <div id="profileStatus" class="auth-status-box" data-i18n="profile.loading">Загружаю профиль...</div>
          </section>
        </main>
      </div>
    </div>
  </div>

  <script src="shared-storage.js"></script>
  <script type="module">
    import { mountAppShell } from "./navigation.js";
    mountAppShell();
  </script>
  <script type="module" src="profile.js"></script>
</body>
</html>
