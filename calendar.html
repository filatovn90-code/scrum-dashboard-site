<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь — MindPulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell page-shell-wide">
    <header class="site-header">
      <div class="site-brand">
        <p class="section-kicker">MindPulse</p>
        <h1>Календарь</h1>
      </div>

      <div class="site-header-actions">
        <nav class="site-nav" aria-label="Основная навигация">
          <a class="nav-link" href="today.html">Сегодня</a>
          <a class="nav-link is-active" href="calendar.html">Календарь</a>
          <a class="nav-link" href="backlog.html">Бэклог</a>
          <a class="nav-link" href="analytics.html">Аналитика</a>
          <a class="nav-link" href="pricing.html">Pricing</a>
        </nav>
        <button class="login-button" id="logoutButton" type="button">Выход</button>
      </div>
    </header>

    <main>
      <section class="section week-timeline-section">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Weekly timeline</p>
            <h2 class="dashboard-section-title">Дедлайны недели</h2>
          </div>

          <div class="week-timeline-controls">
            <div class="quarter-filter">
              <span>Неделя</span>
              <select id="timelineWeekSelect" aria-label="Выбрать неделю"></select>
            </div>
          </div>
        </div>

        <div class="calendar-layout">
          <section class="timeline-board" id="timelineBoard"></section>

          <aside class="timeline-sidebar">
            <section class="section timeline-side-card">
              <p class="section-kicker">All deadlines</p>
              <h3 id="timelineWeekLabel">Неделя</h3>
              <div id="timelineAllDeadlines" class="timeline-deadline-list"></div>
            </section>

            <section class="section timeline-side-card">
              <p class="section-kicker">Selected day</p>
              <h3 id="timelineSelectedDayTitle">Выберите день</h3>
              <div id="timelineSelectedDayMeta" class="timeline-day-meta"></div>
              <div id="timelineSelectedDayDeadlines" class="timeline-deadline-list"></div>

              <form id="timelineDeadlineForm" class="timeline-deadline-form">
                <input id="timelineDeadlineTitle" type="text" placeholder="Название дедлайна" required>
                <input id="timelineDeadlineTime" type="time">
                <button class="form-action-button" type="submit">Добавить дедлайн</button>
              </form>
            </section>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <script src="shared-storage.js"></script>
  <script type="module" src="calendar.js"></script>
</body>
</html>
