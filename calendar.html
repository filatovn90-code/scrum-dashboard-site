<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell page-shell-wide">
    <header class="site-header">
      <div class="site-brand">
        <p class="section-kicker">Scrum Dashboard</p>
        <h1>Календарь</h1>
      </div>

      <div class="site-header-actions">
        <nav class="site-nav" aria-label="Основная навигация">
          <a class="nav-link" href="index.html">Метрики</a>
          <a class="nav-link is-active" href="calendar.html">Календарь</a>
          <a class="nav-link" href="backlog.html">Бэклог</a>
          <a class="nav-link" href="analytics.html">Аналитика</a>
        </nav>
        <button class="login-button" id="logoutButton" type="button">Выход</button>
      </div>
    </header>

    <main>
      <section class="section week-timeline-section">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Weekly timeline</p>
            <h2 class="dashboard-section-title">Дедлайны недели</h2>
          </div>

          <div class="week-timeline-controls">
            <div class="quarter-filter">
              <span>Неделя</span>
              <select id="timelineWeekSelect" aria-label="Выбрать неделю"></select>
            </div>
          </div>
        </div>

        <div class="week-timeline-layout">
          <section class="week-timeline-board" id="timelineBoard"></section>

          <aside class="week-timeline-sidepanel">
            <div class="week-timeline-sidepanel-header">
              <div>
                <p class="calendar-day-panel-kicker">Выбранный день</p>
                <h3 id="timelineSelectedDay"></h3>
              </div>
              <div class="week-timeline-week-meta" id="timelineWeekMeta"></div>
            </div>

            <div class="week-timeline-selected-list" id="timelineSelectedList"></div>

            <form class="week-timeline-form" id="timelineDeadlineForm">
              <input id="timelineDeadlineTitle" type="text" placeholder="Название дедлайна" aria-label="Название дедлайна">
              <input id="timelineDeadlineTime" type="time" aria-label="Время дедлайна">
              <button type="submit" class="calendar-event-submit" id="timelineDeadlineSubmit">Добавить дедлайн</button>
              <button type="button" class="calendar-event-cancel" id="timelineDeadlineCancel" hidden>Отмена</button>
            </form>

            <section class="week-timeline-week-summary">
              <div class="week-timeline-summary-header">
                <p class="calendar-day-panel-kicker">Все дедлайны недели</p>
                <h3 id="timelineSummaryTitle"></h3>
              </div>
              <div class="week-timeline-summary-list" id="timelineSummaryList"></div>
            </section>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <script src="calendar.js"></script>
</body>
</html>
