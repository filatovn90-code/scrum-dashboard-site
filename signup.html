<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — MindPulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-public-active="signup">
  <div class="page-shell page-shell-wide auth-route-page public-page">
    <header data-public-header></header>

    <main class="auth-route-main">
      <section class="section auth-route-card">
        <p class="section-kicker" data-i18n="auth.signUpKicker">Регистрация</p>
        <h2 class="dashboard-section-title" data-i18n="auth.signUpTitle">Откройте личное приложение</h2>
        <p class="auth-route-copy" data-i18n="auth.signUpBody">После регистрации профиль будет создан автоматически, а вы сразу попадёте в защищённую зону.</p>

        <form id="signupPageForm" class="auth-page-form">
          <input id="signupPageEmail" type="email" data-i18n-placeholder="common.email" placeholder="Email" required>
          <input id="signupPagePassword" type="password" data-i18n-placeholder="common.password" placeholder="Пароль" required>
          <input id="signupPagePasswordRepeat" type="password" data-i18n-placeholder="auth.repeatPassword" placeholder="Повторите пароль" required>
          <button id="signupPageSubmit" class="form-action-button" type="submit" data-i18n="auth.createAccount">Создать аккаунт</button>
        </form>

        <div id="signupPageStatus" class="auth-status-box" data-i18n="auth.signupIdle">Используйте email, с которым будете дальше входить в приложение.</div>

        <div class="auth-page-actions">
          <a class="ghost-button auth-page-link" href="login.html" data-i18n="auth.alreadyHaveAccount">Уже есть аккаунт?</a>
        </div>
      </section>
    </main>
  </div>

  <script src="shared-storage.js"></script>
  <script type="module">
    import { mountPublicHeader } from "./navigation.js";
    mountPublicHeader();
  </script>
  <script type="module" src="signup.js"></script>
</body>
</html>
