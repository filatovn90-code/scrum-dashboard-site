<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>План недели — MindPulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body
  data-app-active="plan"
  data-app-title="План недели"
  data-app-subtitle="Вся неделя целиком: задачи по дням, рабочая плотность и фокус на главном."
>
  <div class="app-shell app-page-layout">
    <aside data-app-sidebar></aside>

    <div class="app-main">
      <div class="app-content-shell">
        <header data-app-page-header></header>

        <main>
          <section class="section">
            <div class="section-heading">
              <div>
                <p class="section-kicker" data-i18n="plan.boardKicker">План недели</p>
                <h2 class="dashboard-section-title" data-i18n="plan.boardTitle">План недели</h2>
              </div>
              <div class="quarter-filter">
                <span data-i18n="plan.week">Неделя</span>
                <select id="weekSelect" aria-label="Выбрать неделю" data-i18n-aria-label="plan.pickWeek"></select>
              </div>
            </div>

            <div id="backlogSummary"></div>

            <section class="section backlog-focus-strip" id="focusTodayPanel">
              <div class="section-heading backlog-focus-heading">
                <div>
                  <p class="section-kicker" data-i18n="plan.focusKicker">Фокус дня</p>
                  <h3 class="dashboard-section-title" data-i18n="plan.focusTitle">Фокус на день</h3>
                </div>
                <div class="quarter-filter">
                  <span data-i18n="plan.day">День</span>
                  <select id="focusDaySelect" aria-label="Выбрать день фокуса" data-i18n-aria-label="plan.pickDay"></select>
                </div>
              </div>

              <div id="focusList" class="backlog-focus-list"></div>
            </section>

            <div id="backlogBoard" class="weekly-board"></div>
          </section>
        </main>
      </div>
    </div>
  </div>

  <script src="shared-storage.js"></script>
  <script type="module">
    import { mountAppShell } from "./navigation.js";
    mountAppShell();
  </script>
  <script type="module" src="backlog.js"></script>
</body>
</html>
