<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя неделя — MindPulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell page-shell-wide">
    <header class="site-header">
      <div class="site-brand">
        <p class="section-kicker">MindPulse</p>
        <h1>Моя неделя</h1>
      </div>

      <div class="site-header-actions">
        <nav class="site-nav" aria-label="Основная навигация">
          <a class="nav-link" href="today.html">Пульс дня</a>
          <a class="nav-link" href="ai-coach.html">AI Coach</a>
          <a class="nav-link is-active" href="backlog.html">Моя неделя</a>
          <a class="nav-link" href="analytics.html">Аналитика</a>
          <a class="nav-link" href="pricing.html">Pricing</a>
        </nav>
        <button class="login-button" id="logoutButton" type="button">Выход</button>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Weekly board</p>
            <h2 class="dashboard-section-title">Моя неделя</h2>
          </div>
          <div class="quarter-filter">
            <span>Неделя</span>
            <select id="weekSelect" aria-label="Выбрать неделю"></select>
          </div>
        </div>

        <div id="backlogSummary"></div>

        <section class="section backlog-focus-strip" id="focusTodayPanel">
          <div class="section-heading backlog-focus-heading">
            <div>
              <p class="section-kicker">Today focus</p>
              <h3 class="dashboard-section-title">Фокус на сегодня</h3>
            </div>
            <div class="quarter-filter">
              <span>День</span>
              <select id="focusDaySelect" aria-label="Выбрать день фокуса"></select>
            </div>
          </div>

          <div id="focusList" class="backlog-focus-list"></div>
        </section>

        <div id="backlogBoard" class="weekly-board"></div>
      </section>
    </main>
  </div>

  <script src="shared-storage.js"></script>
  <script type="module" src="backlog.js"></script>
</body>
</html>
