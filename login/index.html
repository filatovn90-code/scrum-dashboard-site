<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Войти — MindPulse</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-public-active="login">
  <div class="page-shell page-shell-wide auth-route-page public-page">
    <header data-public-header></header>

    <main class="auth-route-main">
      <section class="section auth-route-card">
        <p class="section-kicker">Sign in</p>
        <h2 class="dashboard-section-title">Добро пожаловать обратно</h2>
        <p class="auth-route-copy">Войдите, чтобы открыть личный трекер, проекты и check-in.</p>

        <form id="loginPageForm" class="auth-page-form">
          <input id="loginPageEmail" type="email" placeholder="Email" required>
          <input id="loginPagePassword" type="password" placeholder="Пароль" required>
          <button id="loginPageSubmit" class="form-action-button" type="submit">Войти</button>
        </form>

        <div id="loginPageStatus" class="auth-status-box">Введите email и пароль.</div>

        <div class="auth-page-actions">
          <a class="ghost-button auth-page-link" href="../forgot-password/">Забыли пароль?</a>
          <a class="ghost-button auth-page-link" href="../signup/">Создать аккаунт</a>
        </div>
      </section>
    </main>
  </div>

  <script src="../shared-storage.js"></script>
  <script type="module">
    import { mountPublicHeader } from "../navigation.js";
    mountPublicHeader();
  </script>
  <script type="module" src="../login.js"></script>
</body>
</html>
